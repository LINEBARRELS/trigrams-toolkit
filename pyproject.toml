[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trigrams-toolkit"
version = "0.5.2"
description = "Agent skills, project resources and command-line tools for Trigrams toolkit"
readme = "docs/pypi-readme.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "LINEBARRELS"}]
dependencies = [
    "PyYAML==6.0.2",
    "jsonschema==4.24.0",
    "referencing>=0.36.2,<0.38",
    "ruamel.yaml>=0.18.15,<0.19",
]

[project.optional-dependencies]
dev = ["build>=1.2.2,<2", "mypy>=1.15,<2", "types-PyYAML", "types-jsonschema"]

[project.urls]
Homepage = "https://github.com/LINEBARRELS/trigrams-toolkit"
Repository = "https://github.com/LINEBARRELS/trigrams-toolkit"
Issues = "https://github.com/LINEBARRELS/trigrams-toolkit/issues"
Changelog = "https://github.com/LINEBARRELS/trigrams-toolkit/blob/main/CHANGELOG.md"

[project.scripts]
project-state = "trigrams_toolkit.state.cli:main"
plan-toolkit = "trigrams_toolkit.plan.cli:main"
handbook = "trigrams_toolkit.handbook.cli:main"
harness-install = "trigrams_toolkit.installation.harness_install:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trigrams_toolkit = ["py.typed", "resources/**/*.json", "resources/**/*.md", "resources/**/*.toml"]

[tool.mypy]
python_version = "3.11"
files = ["src/trigrams_toolkit"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
cache_dir = ".tmp/mypy-cache"

[[tool.mypy.overrides]]
module = ["trigrams_toolkit.state.*", "trigrams_toolkit.project_context.*", "trigrams_toolkit.resources.*"]
disallow_untyped_defs = true
